<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>WebXR Ocean Simulation</title>
    <link rel="shortcut icon" type="image/x-icon" href="../../../img/favicon.ico" />
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f3f5ef; background: #103f51; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071820; }
      #loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 43%, #143c49 0%, #0b2530 30%, #071820 70%); transition: opacity .75s ease, visibility .75s; }
      #loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
      .loading-content { text-align: center; width: min(88vw, 340px); }
      .loading-name { margin: 0 0 24px; font-size: 18px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: #edf8f5; }
      .loading-track { width: 154px; height: 2px; background: rgba(189,221,222,0.15); margin: auto; overflow: hidden; position: relative; border-radius: 2px; }
      .loading-track::after { content: ""; display: block; width: 45%; height: 100%; background: linear-gradient(90deg, transparent, #93e0d9, transparent); animation: travel 1.7s ease-in-out infinite; }
      @keyframes travel { from { transform: translateX(-100%); } to { transform: translateX(330%); } }
    </style>
</head>
<body>
  <div id="loader" role="status">
    <div class="loading-content">
      <h2 class="loading-name">Ocean Simulation</h2>
      <div class="loading-track"></div>
    </div>
  </div>
  <script src="../commons/dist/bundle.js"></script>
  <script src="dist/bundle.js"></script>
</body>
</html>
